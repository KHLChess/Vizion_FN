<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EBF8FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky)"/>

  <!-- Ground -->
  <rect y="500" width="800" height="100" fill="#F0F4F8"/>

  <!-- House Structure -->
  <rect x="200" y="250" width="400" height="250" fill="#FFFFFF" stroke="#1A365D" stroke-width="4"/>
  <path d="M180 250 L400 100 L620 250" fill="#1A365D"/>

  <!-- Windows -->
  <rect x="250" y="300" width="80" height="100" fill="#C5A059" opacity="0.3"/>
  <rect x="250" y="300" width="80" height="100" fill="none" stroke="#1A365D" stroke-width="2"/>

  <rect x="470" y="300" width="80" height="100" fill="#C5A059" opacity="0.3"/>
  <rect x="470" y="300" width="80" height="100" fill="none" stroke="#1A365D" stroke-width="2"/>

  <!-- Door -->
  <rect x="370" y="380" width="60" height="120" fill="#1A365D"/>

  <!-- Text -->
  <text x="400" y="550" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#1A365D">RESIDENCIA AURORA</text>
</svg>
