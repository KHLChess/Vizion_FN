<div class="overlay">
  <div class="container">
    <i class="material-icons icon">cloud_off</i>
    <h1>Servidor no Disponible</h1>
    <p>No se pudo establecer conexión con el servidor. Por favor, verifique su conexión a internet o inténtelo de nuevo más tarde.</p>
    <button class="btn btn-retry" (click)="onRetry()">
      <i class="material-icons">refresh</i>
      Reintentar
    </button>
  </div>
</div>
