<div class="modal-overlay" *ngIf="isOpen">
  <div class="modal-container" [ngClass]="colorClass">
    <div class="modal-header">
      <i class="material-icons modal-icon">{{ icon }}</i>
      <h3>{{ title }}</h3>
    </div>
    <div class="modal-body">
      <p>{{ message }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" (click)="onCancel()" [disabled]="isLoading">{{ cancelText }}</button>
      <button class="btn btn-confirm" (click)="onConfirm()" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ confirmText }}</span>
        <span *ngIf="isLoading" class="saving-indicator">
          <span class="spinner-small"></span> Procesando...
        </span>
      </button>
    </div>
  </div>
</div>
